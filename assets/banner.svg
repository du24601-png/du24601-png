<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="bt bd">
  <title id="bt">Raymund — AI Product Builder</title>
  <desc id="bd">AI 提案 → Preview → Adopt：人保留最终决定权</desc>
  <style>
    text { font-family:'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101325"/>
      <stop offset="0.55" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.86" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.06" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8B93C8" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="18" fill="url(#g1)"/>
  <rect width="1280" height="320" rx="18" fill="url(#g2)"/>

  <!-- overline -->
  <path transform="translate(80,88)" d="M0-8C1.8-2.2 2.2-1.8 8 0C2.2 1.8 1.8 2.2 0 8C-1.8 2.2-2.2 1.8-8 0C-2.2-1.8-1.8-2.2 0-8Z" fill="url(#ac)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <text x="100" y="93" font-size="13" letter-spacing="4" font-weight="600" fill="#A5B4FC">AI PRODUCT BUILDER</text>

  <!-- name + tagline -->
  <text x="70" y="160" font-size="57" font-weight="700" fill="#EEF1FF">Hi, I'm <tspan fill="url(#ng)">Raymund</tspan></text>
  <text x="72" y="204" font-size="21" fill="#BAC2EC">把模糊的问题，做成可验证的 AI 产品</text>

  <!-- micro chips -->
  <rect x="72" y="234" width="118" height="26" rx="13" fill="#171E3F" stroke="#303A66"/>
  <text x="86" y="252" font-size="12.5" fill="#A9B2E3">3 个产品 0→1</text>
  <rect x="202" y="234" width="136" height="26" rx="13" fill="#171E3F" stroke="#303A66"/>
  <text x="216" y="252" font-size="12.5" fill="#A9B2E3">评测驱动 · 可验证</text>
  <rect x="350" y="234" width="146" height="26" rx="13" fill="#171E3F" stroke="#303A66"/>
  <text x="364" y="252" font-size="12.5" fill="#A9B2E3">Shanghai / Remote</text>

  <!-- AI node -->
  <circle cx="818" cy="157" r="24" fill="#141A38" stroke="url(#ac)" stroke-width="1.6"/>
  <path transform="translate(818,157) scale(1.3)" d="M0-8C1.8-2.2 2.2-1.8 8 0C2.2 1.8 1.8 2.2 0 8C-1.8 2.2-2.2 1.8-8 0C-2.2-1.8-1.8-2.2 0-8Z" fill="url(#ac)">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <text x="818" y="200" text-anchor="middle" font-size="13" fill="#8B93C8">AI 提案</text>

  <!-- connector -->
  <path d="M 846 157 H 874" stroke="#4A558F" stroke-width="1.6" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M 876 151 L 886 157 L 876 163 Z" fill="#4A558F"/>

  <!-- preview card -->
  <rect x="892" y="72" width="326" height="190" rx="14" fill="#000000" opacity="0.38"/>
  <rect x="888" y="64" width="326" height="190" rx="14" fill="#141A38" stroke="#2E3760"/>
  <circle cx="910" cy="86" r="4" fill="#333D6B"/>
  <circle cx="924" cy="86" r="4" fill="#333D6B"/>
  <circle cx="938" cy="86" r="4" fill="#333D6B"/>
  <text x="952" y="90" font-size="11" fill="#7A85B8">canvas · preview</text>

  <path d="M 910 150 H 1186" stroke="#1F2750"/>
  <path d="M 910 176 H 1186" stroke="#1F2750"/>
  <path d="M 910 202 H 1186" stroke="#1F2750"/>

  <rect x="910" y="172" width="30" height="42" rx="3" fill="url(#ac)" opacity="0.8"/>
  <rect x="952" y="156" width="30" height="58" rx="3" fill="url(#ac)" opacity="0.8"/>
  <rect x="994" y="132" width="30" height="82" rx="3" fill="url(#ac)" opacity="0.8"/>
  <rect x="1036" y="104" width="30" height="110" rx="3" fill="url(#ac)" opacity="0.8"/>

  <polyline points="925,164 967,148 1009,124 1051,96" fill="none" stroke="#34D399" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="925" cy="164" r="3.2" fill="#34D399"/>
  <circle cx="967" cy="148" r="3.2" fill="#34D399"/>
  <circle cx="1009" cy="124" r="3.2" fill="#34D399"/>
  <path d="M 1051 102 V 214" stroke="#34D399" opacity="0.45" stroke-dasharray="3 4"/>
  <circle cx="1051" cy="96" r="4.6" fill="#34D399" stroke="#0D1126" stroke-width="1.5"/>

  <rect x="1066" y="188" width="104" height="24" rx="12" fill="#10281F" stroke="#2A5C48"/>
  <text x="1078" y="205" font-size="11.5" fill="#34D399">来源 10-K ✓</text>

  <rect x="1104" y="232" width="92" height="32" rx="16" fill="url(#ac)"/>
  <text x="1150" y="253" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Adopt ✓</text>

  <text x="1051" y="304" text-anchor="middle" font-size="14" fill="#8B93C8">Preview → Adopt，人保留最终决定权</text>
</svg>
